# Example configuration for simulation environment (runs with all external systems mocked)
environment: dev
log_level: DEBUG
namespace: default
node_label_selector: "ran.site=true"
pod_label_selector: "du=true"
kafka_health_topic: "du.health.reports.dev"

# Simulation toggle
simulation_mode: true

# External endpoints can be left blank in simulation; they won't be used.
vault_addr: "http://sim.vault.local"
vault_kubeconfig_path: "kv/data/kubeconfigs/dev"

kafka_bootstrap_servers: "localhost:9092"
loki_url: "http://localhost:3100"
loki_labels: '{app="du-healthcheck",env="sim"}'

# Connectivity (optional; tcp checks will run against provided hosts if any)
# cu_host: ""
cu_port: 38472
# ru_host: ""
ru_port: 22102
connectivity_timeout: 0.5

request_timeout: 2.0
airflow_enabled: false
