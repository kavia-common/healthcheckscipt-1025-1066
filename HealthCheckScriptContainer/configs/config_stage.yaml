# Example configuration for staging environment
environment: stage
log_level: INFO
namespace: du-stage
node_label_selector: "ran.site=true"
pod_label_selector: "du=true"
kafka_health_topic: "du.health.reports.stage"

vault_addr: "https://vault.stage.example.com"
# vault_token: ""  # set via env
vault_kubeconfig_path: "kv/data/kubeconfigs/stage"

kafka_bootstrap_servers: "kafka-1.stage.example.com:9092,kafka-2.stage.example.com:9092"
loki_url: "https://loki.stage.example.com"
# loki_tenant_id: ""  # set via env
loki_labels: '{app="du-healthcheck",env="stage"}'

# Connectivity
# cu_host: "cu.stage.example.com"
cu_port: 38472
# ru_host: "ru.stage.example.com"
ru_port: 22102
connectivity_timeout: 3.0

request_timeout: 8.0
airflow_enabled: true
